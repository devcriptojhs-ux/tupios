[package]
name = "tupi-control-center"
version = "0.1.0"
description = "TUPIOS Control Center — commit management, permission approval, system monitoring"
authors = ["TUPIOS Dev <tupi@tupios.dev>"]
edition = "2021"

[lib]
name = "tupi_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }