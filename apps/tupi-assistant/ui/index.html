<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pajé</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <button id="newChat" class="new-chat"><span data-icon="plus"></span> Nova conversa</button>
    <div class="side-label">Conversas</div>
    <nav id="convList" class="conv-list"></nav>
    <div class="side-footer">
      <button id="openPerms" class="side-btn agent-only hidden"><span data-icon="shield"></span> Permissões da IA</button>
      <button id="openMemory" class="side-btn agent-only hidden"><span data-icon="brain"></span> O que o Pajé sabe sobre mim</button>
      <button id="openAgents" class="side-btn agent-only hidden"><span data-icon="users"></span> Agentes e trabalhos <span id="pajeCount" class="count hidden"></span></button>
      <button id="openConfig" class="side-btn"><span data-icon="sliders"></span> Configurar IA</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="toggleSide" class="icon-btn only-full" title="Mostrar/ocultar conversas"><span data-icon="menu"></span></button>
      <div class="brand"><span class="logo">PJ</span><span class="brand-name">Pajé</span></div>
      <select id="modelSelect" class="model-select" title="Modelo usado nesta conversa"></select>
      <div class="spacer"></div>
      <button id="modeBadge" class="mode-badge hidden" title="Modo de permissões da IA (clique para mudar)"></button>
      <button id="stopBtn" class="stop-btn hidden" title="PARAR IA: cancela tudo o que a IA está fazendo agora"></button>
      <button id="miniNew" class="icon-btn only-mini" title="Nova conversa"><span data-icon="plus"></span></button>
      <button id="miniExpand" class="icon-btn only-mini" title="Abrir a janela completa"><span data-icon="expand"></span></button>
      <button id="miniClose" class="icon-btn only-mini" title="Fechar (Esc)"><span data-icon="x"></span></button>
    </header>
    <div id="agentBar" class="agent-bar hidden"></div>
    <div id="banner" class="banner hidden"></div>
    <div id="approvals" class="approvals hidden"></div>
    <div id="stBar" class="st-bar hidden"></div>
    <section id="messages" class="messages"></section>
    <footer class="composer-wrap">
      <div id="chips" class="chips"></div>
      <div class="composer">
        <button id="attachBtn" class="tool" title="Anexar foto, PDF ou áudio"><span data-icon="clip"></span></button>
        <button id="shotBtn" class="tool" title="Print da tela inteira"><span data-icon="camera"></span></button>
        <button id="cropBtn" class="tool" title="Recortar uma parte da tela"><span data-icon="scissors"></span></button>
        <textarea id="input" rows="1" placeholder="Mensagem para o Pajé…"></textarea>
        <button id="micBtn" class="tool" title="Falar (gravar voz e transcrever)"><span data-icon="mic"></span></button>
        <button id="sendBtn" class="send" title="Enviar (Enter)"><span data-icon="send"></span></button>
      </div>
      <div class="hint">Enter envia · Shift+Enter quebra linha · arraste, cole (Ctrl+V) ou anexe fotos, PDFs e áudios</div>
      <input id="fileInput" type="file" multiple hidden
             accept="image/*,application/pdf,.pdf,audio/*,.mp3,.wav,.ogg,.oga,.opus,.m4a,.aac,.flac,.webm">
    </footer>
  </main>
</div>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <header class="modal-head">
      <nav id="tabs" class="tabs">
        <button data-tab="agentes">Agentes</button>
        <button data-tab="trabalhos">Trabalhos</button>
        <button data-tab="perms">Permissões</button>
        <button data-tab="st">Mudanças em ensaio (ST)</button>
        <button data-tab="memory">O que sabe de mim</button>
        <button data-tab="loop">Proativo</button>
        <button data-tab="sugs">Sugestões</button>
        <button data-tab="history">Ações recentes</button>
        <button data-tab="harness">Harness</button>
      </nav>
      <button id="modalClose" class="icon-btn" title="Fechar"><span data-icon="x"></span></button>
    </header>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>
<div id="dialog" class="dialog hidden"><div id="dialogBox" class="dialog-box"></div></div>
<div id="dropOverlay" class="drop hidden"><div>Solte aqui para anexar</div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
